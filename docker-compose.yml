# MySQL para desarrollo y tests.
#   docker compose up -d      Levanta MySQL en segundo plano
#   docker compose down       Lo detiene (los datos se conservan)
#   docker compose down -v    Lo detiene y borra los datos
#
# Los valores por defecto son los mismos que usa fancyhotel/config.py. Para
# cambiarlos, definí las variables en un archivo .env en la raíz del proyecto.
services:
  mysql:
    image: mysql:8.4
    container_name: fancyhotel-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev}
      MYSQL_DATABASE: ${DB_NAME:-Fancy_Hotel}
      MYSQL_USER: ${DB_USER:-fancyhotel}
      MYSQL_PASSWORD: ${DB_PASSWORD:-fancyhotel_dev}
      TEST_DB_NAME: ${TEST_DB_NAME:-Fancy_Hotel_test}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  mysql-data:
